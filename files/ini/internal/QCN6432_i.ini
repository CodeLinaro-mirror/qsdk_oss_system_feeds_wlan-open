# INI file
# This file will contain QCN6432 specific internal INI configurations

# Datapath configuration Parameters
# Add the data path specific config parameters below
# E.g For DP_RXDMA_BUF_RING
# dp_rxdma_buf_ring=8192

# Tx Monitor Feature Flag
# 0: Feature is disabled
# 1: Feature is enabled
dp_tx_monitor=0

# Control path configuration Parameters
# Add the control path specific config parameters below
# E.g for TID-to-link mapping
# 0 - T2LM is not supported by the MLD
# 1 - MLD only supports the mapping of all TIDs to the same link set
# t2lm_enable=1

# Memory profile setting
# 0 - Indicates the system is not a low memory
# 1 - Implies system is low memory
low_mem_system=0

# 512M Memory profile based parameters
[512M]
dp_reo2ppe_ring=2048
dp_ppe2tcl_ring=2048
dp_rx_release_ring=8192
dp_rxdma_buf_ring=8192
dp_reo_dst_ring0=8192
dp_reo_dst_ring1=8192
dp_reo_dst_ring2=8192
dp_reo_dst_ring3=8192
dp_tcl_data_ring0=2048
dp_tcl_data_ring1=2048
dp_tcl_data_ring2=2048
dp_tcl_data_ring3=2048
dp_tx_comp_ppeds_ring=16384
dp_tx_comp_ring0=16384
dp_tx_comp_ring1=16384
dp_tx_comp_ring2=16384
dp_tx_comp_ring3=16384

[256M]
dp_reo2ppe_ring=2048
dp_ppe2tcl_ring=2048
dp_rx_release_ring=4096
dp_rxdma_buf_ring=2048
dp_reo_dst_ring0=2048
dp_reo_dst_ring1=2048
dp_reo_dst_ring2=2048
dp_reo_dst_ring3=512
dp_tcl_data_ring0=512
dp_tcl_data_ring1=512
dp_tcl_data_ring2=512
dp_tcl_data_ring3=128
dp_tx_comp_ppeds_ring=8192
dp_tx_comp_ring0=8192
dp_tx_comp_ring1=8192
dp_tx_comp_ring2=8192
dp_tx_comp_ring3=1024
