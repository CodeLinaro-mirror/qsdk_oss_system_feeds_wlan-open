install ath12k_wifi8 /bin/sh -c '\
systemctl is-active --quiet wififw-mount.service || systemctl start --no-block wififw-mount.service; \
for i in $(seq 1 30); do \
    systemctl is-active --quiet wififw-mount.service && break; \
    sleep 0.1; \
done; \
for pci_dev in /sys/bus/pci/devices/*; do \
    [ -d "$pci_dev" ] || continue; \
    ID=$(cat "$pci_dev/device" 2>/dev/null) || continue; \
    if [ "xx${ID}" = "xx0x1113" ] || [ "xx${ID}" = "xx0x1114" ]; then \
        /sbin/modprobe --ignore-install ath12k_wifi8 $CMDLINE_OPTS; \
        break; \
    fi; \
done'
